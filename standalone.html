<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>무지개똥 말랑이가 내려와요 🌈💩</title>

    <!--
      Node 없이 바로 보는 버전.
      이 파일을 브라우저로 열기만 하면 됩니다 (더블클릭).
      스타일은 src/styles 의 진짜 CSS 를 그대로 불러 쓰고,
      화면 코드만 이 안에 한 벌 복사돼 있습니다.
    -->
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useCallback, useEffect, useId, useRef, useState } = React

      /* ---------- 말랑이 데이터 ---------- */

      const MAX_POOPS = 60
      let nextId = 0
      const rand = (min, max) => Math.random() * (max - min) + min

      function createPoop() {
        return {
          id: nextId++,
          x: rand(1, 92),
          size: rand(52, 118),
          duration: rand(6.5, 13),
          delay: rand(0, 0.8),
          sway: rand(12, 48),
          swayDuration: rand(1.6, 3.4),
          spinDuration: rand(3, 7),
          spinDir: Math.random() < 0.5 ? -1 : 1,
          hueShift: rand(-35, 35),
        }
      }

      function useFallingPoops(interval) {
        const [poops, setPoops] = useState(() => Array.from({ length: 10 }, createPoop))

        useEffect(() => {
          const timer = setInterval(() => {
            setPoops((prev) => (prev.length >= MAX_POOPS ? prev : [...prev, createPoop()]))
          }, interval)
          return () => clearInterval(timer)
        }, [interval])

        const remove = useCallback((id) => {
          setPoops((prev) => prev.filter((p) => p.id !== id))
        }, [])

        const shower = useCallback((count = 14) => {
          setPoops((prev) => [...prev, ...Array.from({ length: count }, createPoop)])
        }, [])

        return { poops, remove, shower }
      }

      /* ---------- 무지개똥 그림 ---------- */

      function PoopArt({ hueShift = 0 }) {
        const uid = useId()
        const bodyId = `body-${uid.replace(/:/g, '')}`
        return (
          <svg
            className="poop-art"
            viewBox="0 0 120 120"
            role="img"
            aria-label="무지개똥 말랑이"
            style={{ filter: `hue-rotate(${hueShift}deg)` }}
          >
            <defs>
              <linearGradient id={bodyId} x1="0.15" y1="1" x2="0.5" y2="0">
                <stop offset="0%" stopColor="#ff5f8f" />
                <stop offset="20%" stopColor="#ff9a44" />
                <stop offset="42%" stopColor="#ffd93d" />
                <stop offset="62%" stopColor="#5fd97a" />
                <stop offset="82%" stopColor="#4fc3f7" />
                <stop offset="100%" stopColor="#a97bff" />
              </linearGradient>
            </defs>

            <g fill={`url(#${bodyId})`}>
              <ellipse cx="60" cy="97" rx="44" ry="19" />
              <ellipse cx="60" cy="73" rx="34" ry="17" />
              <ellipse cx="60" cy="52" rx="24" ry="14" />
              <ellipse cx="61" cy="36" rx="15" ry="11" />
              <ellipse cx="66" cy="25" rx="8.5" ry="7" />
            </g>

            <g fill="#ffffff" opacity="0.4">
              <ellipse cx="56" cy="32" rx="5" ry="3" />
              <ellipse cx="38" cy="68" rx="7" ry="3.4" transform="rotate(-18 38 68)" />
              <ellipse cx="32" cy="92" rx="9" ry="4" transform="rotate(-12 32 92)" />
            </g>

            <g>
              <ellipse cx="38" cy="99" rx="6" ry="3.8" fill="#ff6f9c" opacity="0.55" />
              <ellipse cx="82" cy="99" rx="6" ry="3.8" fill="#ff6f9c" opacity="0.55" />
              <ellipse cx="47" cy="91" rx="4.4" ry="5.8" fill="#3a2230" />
              <ellipse cx="73" cy="91" rx="4.4" ry="5.8" fill="#3a2230" />
              <circle cx="48.6" cy="88.8" r="1.7" fill="#fff" />
              <circle cx="74.6" cy="88.8" r="1.7" fill="#fff" />
              <path d="M51 101 q9 8.5 18 0" fill="none" stroke="#3a2230" strokeWidth="3" strokeLinecap="round" />
            </g>
          </svg>
        )
      }

      /* ---------- 떨어지는 말랑이 ---------- */

      const POP_MS = 420

      function PoopSquishy({ poop, onPop, onDone }) {
        const [popped, setPopped] = useState(false)
        const bodyRef = useRef(null)

        const handlePop = () => {
          if (popped) return
          setPopped(true)
          const rect = bodyRef.current.getBoundingClientRect()
          onPop({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, size: poop.size })
          setTimeout(() => onDone(poop.id), POP_MS)
        }

        return (
          <div
            className="poop"
            style={{
              '--x': `${poop.x}vw`,
              '--size': `${poop.size}px`,
              '--fall-dur': `${poop.duration}s`,
              '--fall-delay': `${poop.delay}s`,
              '--sway': `${poop.sway}px`,
              '--sway-dur': `${poop.swayDuration}s`,
              '--spin-dur': `${poop.spinDuration}s`,
              '--spin-end': `${poop.spinDir * 360}deg`,
            }}
            onAnimationEnd={(e) => {
              if (e.animationName === 'fall') onDone(poop.id)
            }}
          >
            <div className="poop__sway">
              <div className="poop__spin">
                <button
                  ref={bodyRef}
                  type="button"
                  className={`poop__body${popped ? ' is-popped' : ''}`}
                  aria-label="무지개똥 말랑이 누르기"
                  onPointerDown={handlePop}
                >
                  <PoopArt hueShift={poop.hueShift} />
                </button>
              </div>
            </div>
          </div>
        )
      }

      /* ---------- 반짝이 ---------- */

      const COLORS = ['#ff5f8f', '#ff9a44', '#ffd93d', '#5fd97a', '#4fc3f7', '#a97bff']

      function Sparkles({ burst, onDone }) {
        const pieces = Array.from({ length: 12 }, (_, i) => {
          const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4
          const distance = burst.size * (0.5 + Math.random() * 0.7)
          return {
            dx: Math.cos(angle) * distance,
            dy: Math.sin(angle) * distance,
            color: COLORS[i % COLORS.length],
            size: 6 + Math.random() * 8,
          }
        })

        return (
          <div className="sparkles" style={{ left: burst.x, top: burst.y }} onAnimationEnd={() => onDone(burst.id)}>
            {pieces.map((p, i) => (
              <span
                key={i}
                className="sparkle"
                style={{
                  '--dx': `${p.dx}px`,
                  '--dy': `${p.dy}px`,
                  '--sparkle-size': `${p.size}px`,
                  background: p.color,
                  animationDelay: `${i * 0.004}s`,
                }}
              />
            ))}
          </div>
        )
      }

      /* ---------- 배경 ---------- */

      const CLOUDS = [
        { top: '8%', scale: 1.1, duration: 48, delay: 0 },
        { top: '22%', scale: 0.7, duration: 68, delay: -12 },
        { top: '38%', scale: 1.35, duration: 84, delay: -40 },
        { top: '54%', scale: 0.85, duration: 58, delay: -26 },
        { top: '68%', scale: 1.0, duration: 92, delay: -70 },
      ]

      function Sky() {
        return (
          <div className="sky" aria-hidden="true">
            <div className="sun" />
            {CLOUDS.map((c, i) => (
              <div
                key={i}
                className="cloud"
                style={{
                  top: c.top,
                  '--cloud-scale': c.scale,
                  animationDuration: `${c.duration}s`,
                  animationDelay: `${c.delay}s`,
                }}
              />
            ))}
            <div className="hill hill--back" />
            <div className="hill hill--front" />
          </div>
        )
      }

      /* ---------- HUD ---------- */

      function Hud({ score, level, levels, onLevelChange, onShower }) {
        return (
          <header className="hud">
            <h1 className="hud__title">
              무지개똥 말랑이가 <span className="hud__title-accent">내려와요</span>
            </h1>
            <p className="hud__hint">말랑이를 눌러서 말랑말랑 터뜨려 보세요!</p>

            <div className="hud__score">
              <span className="hud__score-label">터뜨린 말랑이</span>
              <strong className="hud__score-value" key={score}>
                {score}
              </strong>
            </div>

            <div className="hud__controls">
              {Object.keys(levels).map((name) => (
                <button
                  key={name}
                  type="button"
                  className={`chip${name === level ? ' is-active' : ''}`}
                  onClick={() => onLevelChange(name)}
                >
                  {name}
                </button>
              ))}
              <button type="button" className="chip chip--shower" onClick={() => onShower()}>
                쏟아붓기 🌈
              </button>
            </div>
          </header>
        )
      }

      /* ---------- 앱 ---------- */

      const LEVELS = {
        보슬보슬: 950,
        적당히: 450,
        '똥폭우 🌧️': 160,
      }

      function App() {
        const [level, setLevel] = useState('적당히')
        const [score, setScore] = useState(0)
        const [bursts, setBursts] = useState([])
        const burstId = useRef(0)

        const { poops, remove, shower } = useFallingPoops(LEVELS[level])

        const handlePop = useCallback((spot) => {
          setScore((s) => s + 1)
          setBursts((prev) => [...prev, { ...spot, id: burstId.current++ }])
        }, [])

        const removeBurst = useCallback((id) => {
          setBursts((prev) => prev.filter((b) => b.id !== id))
        }, [])

        return (
          <main className="app">
            <Sky />

            <div className="poop-layer">
              {poops.map((poop) => (
                <PoopSquishy key={poop.id} poop={poop} onPop={handlePop} onDone={remove} />
              ))}
            </div>

            <div className="sparkle-layer">
              {bursts.map((burst) => (
                <Sparkles key={burst.id} burst={burst} onDone={removeBurst} />
              ))}
            </div>

            <Hud score={score} level={level} levels={LEVELS} onLevelChange={setLevel} onShower={() => shower(16)} />
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
