<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>무지개똥 말랑이가 내려와요 🌈💩</title>

    <!--
      Node 없이 바로 보는 버전.
      이 파일을 브라우저로 열기만 하면 됩니다 (더블클릭).
      스타일은 src/styles 의 진짜 CSS 를 그대로 불러 쓰고,
      화면 코드만 이 안에 한 벌 복사돼 있습니다. (src/ 를 고치면 여기도 맞춰주세요)
    -->
    <link rel="stylesheet" href="./src/styles/index.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useCallback, useEffect, useId, useRef, useState } = React

      /* ---------- 말랑이 데이터 ---------- */

      let nextId = 0
      const rand = (min, max) => Math.random() * (max - min) + min

      const FACE_POOL = [
        { name: 'smile', weight: 30 },
        { name: 'wink', weight: 14 },
        { name: 'happy', weight: 16 },
        { name: 'surprised', weight: 8 },
        { name: 'sleepy', weight: 10 },
        { name: 'tongue', weight: 12 },
        { name: 'love', weight: 5 },
      ]

      const SPECIALS = [
        { type: 'gold', chance: 0.07 },
        { type: 'fart', chance: 0.1 },
        { type: 'king', chance: 0.04 },
      ]

      function pickFace() {
        const total = FACE_POOL.reduce((sum, f) => sum + f.weight, 0)
        let roll = Math.random() * total
        for (const f of FACE_POOL) {
          roll -= f.weight
          if (roll <= 0) return f.name
        }
        return 'smile'
      }

      function pickType() {
        let roll = Math.random()
        for (const s of SPECIALS) {
          roll -= s.chance
          if (roll < 0) return s.type
        }
        return 'normal'
      }

      function createPoop(speed = 1) {
        const type = pickType()
        const size = type === 'king' ? rand(130, 165) : rand(52, 118)
        const duration = (type === 'king' ? rand(11, 16) : rand(6.5, 13)) / speed

        return {
          id: nextId++,
          bornAt: Date.now(),
          lifeMs: (duration * 2.5 + 1) * 1000 + 2000,
          type,
          face: type === 'fart' ? 'dizzy' : pickFace(),
          x: rand(1, 92),
          size,
          duration,
          delay: rand(0, 0.8),
          sway: rand(12, 48),
          swayDuration: rand(1.6, 3.4),
          spinDuration: rand(3, 7),
          spinDir: Math.random() < 0.5 ? -1 : 1,
          hueShift: type === 'normal' ? rand(-35, 35) : 0,
          jellyDuration: rand(1.2, 1.9),
          jellyDelay: rand(0, 1.5),
        }
      }

      function useFallingPoops({ spawnMs, maxPoops, speed = 1, burstOnEnter = 0 }) {
        const [poops, setPoops] = useState(() => Array.from({ length: 10 }, () => createPoop()))
        const prevSpawnMs = useRef(null)

        useEffect(() => {
          const presetChanged = prevSpawnMs.current !== null && prevSpawnMs.current !== spawnMs
          prevSpawnMs.current = spawnMs
          if (presetChanged && burstOnEnter > 0) {
            setPoops((prev) => [...prev, ...Array.from({ length: burstOnEnter }, () => createPoop(speed))])
          }

          const timer = setInterval(() => {
            setPoops((prev) => {
              const now = Date.now()
              const alive = prev.filter((p) => now - p.bornAt < p.lifeMs)
              return alive.length >= maxPoops ? alive : [...alive, createPoop(speed)]
            })
          }, spawnMs)
          return () => clearInterval(timer)
        }, [spawnMs, maxPoops, speed, burstOnEnter])

        const remove = useCallback((id) => {
          setPoops((prev) => prev.filter((p) => p.id !== id))
        }, [])

        const shower = useCallback(
          (count = 14) => {
            setPoops((prev) => [...prev, ...Array.from({ length: count }, () => createPoop(speed))])
          },
          [speed],
        )

        return { poops, remove, shower }
      }

      /* ---------- 효과음 ---------- */

      function useSound() {
        const ctxRef = useRef(null)
        const mutedRef = useRef(false)
        const [muted, setMuted] = useState(false)

        const getCtx = () => {
          if (!ctxRef.current) {
            const Ctx = window.AudioContext || window.webkitAudioContext
            if (!Ctx) return null
            ctxRef.current = new Ctx()
          }
          return ctxRef.current
        }

        const play = useCallback((kind) => {
          if (mutedRef.current) return
          try {
            const ac = getCtx()
            if (!ac) return
            if (ac.state === 'suspended') ac.resume()
            const t = ac.currentTime

            const tone = (type, freqFrom, freqTo, start, dur, volume = 0.22) => {
              const osc = ac.createOscillator()
              const gain = ac.createGain()
              osc.type = type
              osc.frequency.setValueAtTime(freqFrom, t + start)
              osc.frequency.exponentialRampToValueAtTime(freqTo, t + start + dur)
              gain.gain.setValueAtTime(volume, t + start)
              gain.gain.exponentialRampToValueAtTime(0.001, t + start + dur)
              osc.connect(gain)
              gain.connect(ac.destination)
              osc.start(t + start)
              osc.stop(t + start + dur + 0.02)
            }

            if (kind === 'pop') {
              const base = 300 + Math.random() * 250
              tone('sine', base, base * 2.2, 0, 0.12, 0.25)
            } else if (kind === 'gold') {
              tone('sine', 880, 880, 0, 0.09, 0.18)
              tone('sine', 1174, 1174, 0.08, 0.09, 0.18)
              tone('sine', 1568, 1568, 0.16, 0.16, 0.18)
            } else if (kind === 'fart') {
              tone('sawtooth', 110, 55, 0, 0.28, 0.16)
              tone('sawtooth', 90, 50, 0.04, 0.24, 0.12)
            } else if (kind === 'bonk') {
              tone('sine', 170, 80, 0, 0.1, 0.28)
            }
          } catch {}
        }, [])

        const toggleMute = useCallback(() => {
          mutedRef.current = !mutedRef.current
          setMuted(mutedRef.current)
        }, [])

        return { muted, toggleMute, play }
      }

      /* ---------- 무지개똥 그림 ---------- */

      const INK = '#3a2230'

      const GRADIENTS = {
        normal: [
          ['0%', '#ff5f8f'],
          ['20%', '#ff9a44'],
          ['42%', '#ffd93d'],
          ['62%', '#5fd97a'],
          ['82%', '#4fc3f7'],
          ['100%', '#a97bff'],
        ],
        gold: [
          ['0%', '#ff9d00'],
          ['35%', '#ffbe2e'],
          ['70%', '#ffd93d'],
          ['100%', '#fff3b0'],
        ],
        fart: [
          ['0%', '#6e7f3c'],
          ['45%', '#97ab55'],
          ['80%', '#b9c876'],
          ['100%', '#d3dc95'],
        ],
      }
      GRADIENTS.king = GRADIENTS.normal

      const ART_LABELS = {
        normal: '무지개똥 말랑이',
        gold: '황금똥 말랑이',
        fart: '방귀똥 말랑이',
        king: '왕똥 말랑이',
      }

      const BODY = [
        [60, 97, 44, 19],
        [60, 73, 34, 17],
        [60, 52, 24, 14],
        [61, 36, 15, 11],
        [66, 25, 8.5, 7],
      ]

      const STAR = 'M0 -5.5 L1.3 -1.3 L5.5 0 L1.3 1.3 L0 5.5 L-1.3 1.3 L-5.5 0 L-1.3 -1.3 Z'

      const bodyEllipses = BODY.map(([cx, cy, rx, ry]) => (
        <ellipse key={`${cx}-${cy}`} cx={cx} cy={cy} rx={rx} ry={ry} />
      ))

      function OpenEye({ cx }) {
        return (
          <g>
            <ellipse cx={cx} cy="91" rx="4.4" ry="5.8" fill={INK} />
            <circle cx={cx + 1.6} cy="88.8" r="1.7" fill="#fff" />
          </g>
        )
      }

      function HappyEye({ x }) {
        return <path d={`M${x} 92 q6 -6.5 12 0`} fill="none" stroke={INK} strokeWidth="3.2" strokeLinecap="round" />
      }

      function SleepyEye({ x }) {
        return <path d={`M${x} 90 q6 5 12 0`} fill="none" stroke={INK} strokeWidth="3.2" strokeLinecap="round" />
      }

      function HeartEye({ cx }) {
        return (
          <g transform={`translate(${cx} 90.5) scale(1.25)`}>
            <path d="M0 3 C -4 -1.2 -3.2 -5.4 0 -3.2 C 3.2 -5.4 4 -1.2 0 3 Z" fill="#ff4f7e" />
          </g>
        )
      }

      function CrossEye({ cx }) {
        return (
          <g stroke={INK} strokeWidth="2.8" strokeLinecap="round">
            <path d={`M${cx - 4} 87 l8 8`} />
            <path d={`M${cx + 4} 87 l-8 8`} />
          </g>
        )
      }

      const Smile = () => (
        <path d="M51 101 q9 8.5 18 0" fill="none" stroke={INK} strokeWidth="3" strokeLinecap="round" />
      )

      const OpenSmile = () => <path d="M50 99 q10 12 20 0 Z" fill={INK} />

      const FACES = {
        smile: (
          <>
            <g className="poop-face__eyes">
              <OpenEye cx={47} />
              <OpenEye cx={73} />
            </g>
            <Smile />
          </>
        ),
        wink: (
          <>
            <g className="poop-face__eyes">
              <OpenEye cx={47} />
            </g>
            <path d="M67 91 q6 -4.5 12 0" fill="none" stroke={INK} strokeWidth="3" strokeLinecap="round" />
            <Smile />
          </>
        ),
        happy: (
          <>
            <HappyEye x={41} />
            <HappyEye x={67} />
            <OpenSmile />
          </>
        ),
        surprised: (
          <>
            <circle cx="47" cy="91" r="4.6" fill={INK} />
            <circle cx="73" cy="91" r="4.6" fill={INK} />
            <circle cx="48.6" cy="89.2" r="1.6" fill="#fff" />
            <circle cx="74.6" cy="89.2" r="1.6" fill="#fff" />
            <ellipse cx="60" cy="103" rx="4.5" ry="5.5" fill={INK} />
          </>
        ),
        sleepy: (
          <>
            <SleepyEye x={41} />
            <SleepyEye x={67} />
            <circle cx="60" cy="102.5" r="2.6" fill={INK} />
            <text x="88" y="78" fontSize="11" fontWeight="700" fill={INK} opacity="0.75">
              z
            </text>
            <text x="96" y="70" fontSize="8" fontWeight="700" fill={INK} opacity="0.55">
              z
            </text>
          </>
        ),
        tongue: (
          <>
            <g className="poop-face__eyes">
              <OpenEye cx={47} />
              <OpenEye cx={73} />
            </g>
            <Smile />
            <ellipse cx="61" cy="104.5" rx="4" ry="4.5" fill="#ff6f9c" />
          </>
        ),
        love: (
          <>
            <HeartEye cx={47} />
            <HeartEye cx={73} />
            <OpenSmile />
          </>
        ),
        dizzy: (
          <>
            <CrossEye cx={47} />
            <CrossEye cx={73} />
            <path d="M51 102 q4.5 -4 9 0 q4.5 4 9 0" fill="none" stroke={INK} strokeWidth="3" strokeLinecap="round" />
          </>
        ),
      }

      const Crown = () => (
        <g transform="rotate(8 66 12)">
          <path
            d="M54 18 L56 5 L62.5 11.5 L67 3 L71.5 11.5 L78 5 L80 18 Z"
            fill="#ffd23e"
            stroke="#e0a615"
            strokeWidth="1.5"
            strokeLinejoin="round"
          />
          <circle cx="56" cy="5" r="1.8" fill="#ff6f9c" />
          <circle cx="67" cy="3" r="1.8" fill="#4fc3f7" />
          <circle cx="78" cy="5" r="1.8" fill="#5fd97a" />
        </g>
      )

      const GoldSparkles = () => (
        <g fill="#fffbe6">
          <g transform="translate(24 38)">
            <path d={STAR} className="twinkle" />
          </g>
          <g transform="translate(99 62) scale(0.8)">
            <path d={STAR} className="twinkle twinkle--2" />
          </g>
          <g transform="translate(88 20) scale(0.65)">
            <path d={STAR} className="twinkle twinkle--3" />
          </g>
        </g>
      )

      const Fumes = () => (
        <g stroke="#7f9450" strokeWidth="2.6" strokeLinecap="round" fill="none" opacity="0.8">
          <g transform="translate(48 10)">
            <path d="M0 8 q3 -3 0 -6 q-3 -3 0 -6" className="fume" />
          </g>
          <g transform="translate(62 6)">
            <path d="M0 9 q3.5 -3.5 0 -7 q-3.5 -3.5 0 -7" className="fume fume--2" />
          </g>
          <g transform="translate(74 12)">
            <path d="M0 7 q2.5 -2.5 0 -5 q-2.5 -2.5 0 -5" className="fume fume--3" />
          </g>
        </g>
      )

      function PoopArt({ type = 'normal', face = 'smile', hueShift = 0 }) {
        const uid = useId().replace(/:/g, '')
        const bodyId = `body-${uid}`
        const clipId = `clip-${uid}`
        const shineId = `shine-${uid}`
        const blurS = `blur-s-${uid}`
        const blurM = `blur-m-${uid}`
        const stops = GRADIENTS[type] || GRADIENTS.normal

        return (
          <svg
            className={`poop-art${type === 'gold' ? ' poop-art--gold' : ''}`}
            viewBox="0 0 120 120"
            role="img"
            aria-label={ART_LABELS[type] || ART_LABELS.normal}
            style={{ '--hue': `${hueShift}deg` }}
          >
            <defs>
              <linearGradient id={bodyId} x1="0.15" y1="1" x2="0.5" y2="0">
                {stops.map(([offset, color]) => (
                  <stop key={offset} offset={offset} stopColor={color} />
                ))}
              </linearGradient>
              <radialGradient id={shineId} cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stopColor="#fff" stopOpacity="0.5" />
                <stop offset="55%" stopColor="#fff" stopOpacity="0.16" />
                <stop offset="100%" stopColor="#fff" stopOpacity="0" />
              </radialGradient>
              <clipPath id={clipId}>{bodyEllipses}</clipPath>
              <filter id={blurS} x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="1.3" />
              </filter>
              <filter id={blurM} x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="2.6" />
              </filter>
            </defs>

            <g fill={`url(#${bodyId})`}>{bodyEllipses}</g>

            <g clipPath={`url(#${clipId})`}>
              <ellipse cx="46" cy="50" rx="36" ry="42" fill={`url(#${shineId})`} />
              <g fill={INK} opacity="0.15" filter={`url(#${blurM})`}>
                <ellipse cx="66" cy="31" rx="10" ry="3.6" />
                <ellipse cx="61" cy="45" rx="17" ry="4.6" />
                <ellipse cx="60" cy="64" rx="26" ry="5.4" />
                <ellipse cx="60" cy="86" rx="36" ry="6.4" />
              </g>
              <ellipse cx="60" cy="114" rx="52" ry="16" fill={INK} opacity="0.13" filter={`url(#${blurM})`} />
              <path
                d="M24 106 Q60 122 96 106"
                fill="none"
                stroke="#fff"
                strokeWidth="4"
                opacity="0.35"
                filter={`url(#${blurM})`}
              />
            </g>

            <g fill="#fff">
              <g opacity="0.4" filter={`url(#${blurS})`}>
                <ellipse cx="63" cy="21.5" rx="4.5" ry="2.4" transform="rotate(-12 63 21.5)" />
                <ellipse cx="55" cy="31.5" rx="7" ry="3" transform="rotate(-14 55 31.5)" />
                <ellipse cx="51" cy="47" rx="10" ry="3.8" transform="rotate(-13 51 47)" />
                <ellipse cx="47" cy="67.5" rx="13" ry="4.4" transform="rotate(-12 47 67.5)" />
                <ellipse cx="43" cy="90" rx="16" ry="5.2" transform="rotate(-10 43 90)" />
              </g>
              <g opacity="0.85">
                <ellipse cx="60" cy="20.5" rx="2" ry="1.1" transform="rotate(-14 60 20.5)" />
                <ellipse cx="51.5" cy="30" rx="3" ry="1.4" transform="rotate(-15 51.5 30)" />
                <ellipse cx="46" cy="45" rx="4.2" ry="1.8" transform="rotate(-14 46 45)" />
                <ellipse cx="41" cy="65" rx="5.4" ry="2" transform="rotate(-13 41 65)" />
                <ellipse cx="36" cy="87.5" rx="6.5" ry="2.4" transform="rotate(-11 36 87.5)" />
              </g>
            </g>

            {type === 'king' && <Crown />}
            {type === 'gold' && <GoldSparkles />}
            {type === 'fart' && <Fumes />}

            <g>
              <ellipse cx="38" cy="99" rx="6" ry="3.8" fill="#ff6f9c" opacity="0.55" />
              <ellipse cx="82" cy="99" rx="6" ry="3.8" fill="#ff6f9c" opacity="0.55" />
              {FACES[face] || FACES.smile}
            </g>
          </svg>
        )
      }

      /* ---------- 떨어지는 말랑이 ---------- */

      const POP_MS = 420
      const HITS_NEEDED = { king: 2 }

      function PoopSquishy({ poop, onPop, onHit, onDone }) {
        const [popped, setPopped] = useState(false)
        const [hits, setHits] = useState(0)
        const [flinching, setFlinching] = useState(false)
        const bodyRef = useRef(null)
        const hitCount = useRef(0)

        const needed = HITS_NEEDED[poop.type] || 1

        const handlePress = () => {
          if (popped) return

          const next = ++hitCount.current
          if (next < needed) {
            setHits(next)
            setFlinching(true)
            onHit?.()
            return
          }

          setPopped(true)
          const rect = bodyRef.current.getBoundingClientRect()
          onPop({
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
            size: poop.size,
            type: poop.type,
          })

          setTimeout(() => onDone(poop.id), POP_MS)
        }

        const face = popped || hits > 0 ? 'surprised' : poop.face

        return (
          <div
            className="poop"
            style={{
              '--x': `${poop.x}vw`,
              '--size': `${poop.size}px`,
              '--fall-dur': `${poop.duration}s`,
              '--fall-delay': `${poop.delay}s`,
              '--sway': `${poop.sway}px`,
              '--sway-dur': `${poop.swayDuration}s`,
              '--spin-dur': `${poop.spinDuration}s`,
              '--spin-end': `${poop.spinDir * 360}deg`,
              '--jelly-dur': `${poop.jellyDuration}s`,
              '--jelly-delay': `${poop.jellyDelay}s`,
            }}
            onAnimationEnd={(e) => {
              if (e.animationName === 'fall') onDone(poop.id)
            }}
          >
            <div className="poop__sway">
              <div className="poop__spin">
                <button
                  ref={bodyRef}
                  type="button"
                  className={`poop__body${popped ? ' is-popped' : ''}${flinching ? ' is-hit' : ''}`}
                  aria-label={`${poop.type === 'king' ? '왕똥' : '무지개똥'} 말랑이 누르기`}
                  onPointerDown={handlePress}
                  onAnimationEnd={(e) => {
                    if (e.animationName === 'bonk') setFlinching(false)
                  }}
                >
                  <PoopArt type={poop.type} face={face} hueShift={poop.hueShift} />
                </button>
              </div>
            </div>
          </div>
        )
      }

      /* ---------- 반짝이 ---------- */

      const RAINBOW = ['#ff5f8f', '#ff9a44', '#ffd93d', '#5fd97a', '#4fc3f7', '#a97bff']

      const PALETTES = {
        normal: RAINBOW,
        king: RAINBOW,
        gold: ['#ffe98a', '#ffd23e', '#fff6cc', '#ffb300'],
        fart: ['#93a852', '#b9c97a', '#77894a', '#d3dc95'],
      }

      function Sparkles({ burst, onDone }) {
        const colors = PALETTES[burst.type] || RAINBOW
        const pieces = Array.from({ length: 12 }, (_, i) => {
          const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4
          const distance = burst.size * (0.5 + Math.random() * 0.7)
          return {
            dx: Math.cos(angle) * distance,
            dy: Math.sin(angle) * distance,
            color: colors[i % colors.length],
            size: 6 + Math.random() * 8,
          }
        })

        return (
          <div className="sparkles" style={{ left: burst.x, top: burst.y }} onAnimationEnd={() => onDone(burst.id)}>
            {pieces.map((p, i) => (
              <span
                key={i}
                className="sparkle"
                style={{
                  '--dx': `${p.dx}px`,
                  '--dy': `${p.dy}px`,
                  '--sparkle-size': `${p.size}px`,
                  background: p.color,
                  animationDelay: `${i * 0.004}s`,
                }}
              />
            ))}
          </div>
        )
      }

      /* ---------- 배경 ---------- */

      const CLOUDS = [
        { top: '8%', scale: 1.1, duration: 48, delay: 0 },
        { top: '22%', scale: 0.7, duration: 68, delay: -12 },
        { top: '38%', scale: 1.35, duration: 84, delay: -40 },
        { top: '54%', scale: 0.85, duration: 58, delay: -26 },
        { top: '68%', scale: 1.0, duration: 92, delay: -70 },
      ]

      function Sky() {
        return (
          <div className="sky" aria-hidden="true">
            <div className="sun" />
            {CLOUDS.map((c, i) => (
              <div
                key={i}
                className="cloud"
                style={{
                  top: c.top,
                  '--cloud-scale': c.scale,
                  animationDuration: `${c.duration}s`,
                  animationDelay: `${c.delay}s`,
                }}
              />
            ))}
            <div className="hill hill--back" />
            <div className="hill hill--front" />
          </div>
        )
      }

      /* ---------- 점수 팝업 ---------- */

      function ScorePop({ pop, onDone }) {
        const positive = pop.value > 0
        const label = positive ? `+${pop.value}` : `−${Math.abs(pop.value)}`
        const flavor = pop.type === 'gold' ? ' ✨' : pop.type === 'fart' ? ' 💨' : ''
        const cls = pop.value < 0 ? ' score-pop--bad' : pop.value >= 5 ? ' score-pop--great' : ''

        return (
          <div className={`score-pop${cls}`} style={{ left: pop.x, top: pop.y }} onAnimationEnd={() => onDone(pop.id)}>
            {label}
            {flavor}
            {positive && pop.mult > 1 && <span className="score-pop__combo">×{pop.mult}</span>}
          </div>
        )
      }

      /* ---------- 챌린지 결과 카드 ---------- */

      function ResultCard({ score, best, newBest, copied, onRetry, onExit, onShare }) {
        return (
          <div className="result">
            <div className="result__card">
              <p className="result__emoji" aria-hidden="true">
                {newBest ? '🏆' : '🌈'}
              </p>
              <h2 className="result__title">{newBest ? '새 기록이에요!' : '60초 끝!'}</h2>
              <p className="result__score">{score}점</p>
              <p className="result__best">지금까지 최고 기록은 {best}점이에요</p>

              <div className="result__actions">
                <button type="button" className="chip chip--shower" onClick={onRetry}>
                  🔁 다시 도전하기
                </button>
                <button type="button" className="chip" onClick={onShare}>
                  {copied ? '링크를 복사했어요!' : '📣 기록 자랑하기'}
                </button>
                <button type="button" className="chip" onClick={onExit}>
                  그냥 놀기
                </button>
              </div>
            </div>
          </div>
        )
      }

      /* ---------- 설정 버튼 아이콘 ---------- */

      const GEAR_COLORS = ['#ff5f8f', '#ff9a44', '#ffd93d', '#5fd97a', '#4fc3f7', '#a97bff', '#ff6f9c', '#ffb03a']

      function GearIcon() {
        const teeth = GEAR_COLORS.map((color, i) => {
          const angle = (Math.PI / 4) * i - Math.PI / 2
          return {
            color,
            cx: 16 + Math.cos(angle) * 10.8,
            cy: 16 + Math.sin(angle) * 10.8,
          }
        })

        return (
          <svg className="gear__icon" viewBox="0 0 32 32" aria-hidden="true">
            {teeth.map((t) => (
              <circle key={t.color} cx={t.cx} cy={t.cy} r="4.6" fill={t.color} />
            ))}
            <circle cx="16" cy="16" r="9.6" fill="#fff" />
            <circle cx="16" cy="16" r="4.6" fill="none" stroke="#ff5f8f" strokeWidth="3" />
            <ellipse cx="12" cy="10.5" rx="3.4" ry="1.9" fill="#fff" opacity="0.55" transform="rotate(-28 12 10.5)" />
          </svg>
        )
      }

      /* ---------- 설정 시트 ---------- */

      function SettingsSheet({ muted, onToggleMute, onClose }) {
        return (
          <div className="sheet" onClick={onClose} role="dialog" aria-modal="true" aria-label="설정">
            <div className="sheet__card" onClick={(e) => e.stopPropagation()}>
              <div className="sheet__head">
                <h2 className="sheet__title">⚙️ 설정</h2>
                <button type="button" className="sheet__close" onClick={onClose} aria-label="설정 닫기">
                  ✕
                </button>
              </div>

              <section className="sheet__section">
                <h3 className="sheet__label">소리</h3>
                <button type="button" className="chip" onClick={onToggleMute} aria-pressed={muted}>
                  {muted ? '🔇 꺼져 있어요 — 누르면 켜져요' : '🔊 켜져 있어요 — 누르면 꺼져요'}
                </button>
              </section>

              <section className="sheet__section">
                <h3 className="sheet__label">게임 설명서</h3>
                <ul className="sheet__guide">
                  <li>💩 말랑이를 누르면 터지면서 +1점!</li>
                  <li>✨ 황금똥은 +5점이에요</li>
                  <li>👑 왕똥은 두 번 눌러야 터져요 (+3점)</li>
                  <li>💨 방귀똥은 −3점에 콤보도 끊겨요 — 피하세요!</li>
                  <li>🔥 1.5초 안에 연달아 터뜨리면 콤보! 5연속 ×2 · 10연속 ×3</li>
                  <li>⏱ 60초 챌린지에서 최고 기록에 도전해 보세요</li>
                </ul>
              </section>

              <section className="sheet__section">
                <h3 className="sheet__label">폰으로 즐기기</h3>
                <img className="sheet__qr" src="./public/qr.svg" alt="게임 주소 QR 코드" width="132" height="132" />
                <p className="sheet__note">카메라로 찍으면 폰에서 바로 열려요</p>
              </section>

              <section className="sheet__section">
                <h3 className="sheet__label">만든 사람</h3>
                <p className="sheet__note">
                  0ys ·{' '}
                  <a href="https://github.com/0ys/rainbow-poop" target="_blank" rel="noreferrer">
                    GitHub에서 코드 보기
                  </a>
                </p>
              </section>
            </div>
          </div>
        )
      }

      /* ---------- HUD ---------- */

      function Hud({
        score,
        best,
        comboCount,
        mult,
        level,
        levels,
        mode,
        timeLeft,
        onLevelChange,
        onShower,
        onStartChallenge,
        onOpenSettings,
      }) {
        const inChallenge = mode === 'challenge'

        return (
          <>
            <header className="hud">
              <h1 className="hud__title">
                무지개똥 말랑이가 <span className="hud__title-accent">내려와요</span>
              </h1>
              <p className="hud__hint">말랑이를 눌러서 말랑말랑 터뜨려 보세요!</p>

              <div className="hud__score-row">
                <div className="hud__score">
                  <span className="hud__score-label">점수</span>
                  <strong className="hud__score-value" key={score}>
                    {score}
                  </strong>
                </div>

                {inChallenge && (
                  <div className="hud__score hud__timer">
                    <span className="hud__score-label">남은 시간</span>
                    <strong className={`hud__score-value hud__timer-value${timeLeft <= 10 ? ' is-low' : ''}`} key={timeLeft}>
                      {timeLeft}초
                    </strong>
                  </div>
                )}

                {!inChallenge && best > 0 && (
                  <div className="hud__score hud__best">
                    <span className="hud__score-label">🏆 60초 최고</span>
                    <strong className="hud__score-value hud__best-value">{best}점</strong>
                  </div>
                )}
              </div>

              {comboCount >= 2 && (
                <div className="hud__combo" key={comboCount}>
                  🔥 {comboCount}연속{mult > 1 ? ` — 점수 ×${mult}` : ''}
                </div>
              )}
            </header>

            <button type="button" className="gear" onClick={onOpenSettings} aria-label="설정 열기">
              <GearIcon />
            </button>

            <nav className="dock" aria-label="게임 조작">
              {Object.keys(levels).map((name) => (
                <button
                  key={name}
                  type="button"
                  className={`chip${name === level ? ' is-active' : ''}`}
                  onClick={() => onLevelChange(name)}
                >
                  {name}
                </button>
              ))}
              <button type="button" className="chip chip--shower" onClick={() => onShower()}>
                쏟아붓기 🌈
              </button>
              {!inChallenge && (
                <button type="button" className="chip chip--challenge" onClick={onStartChallenge}>
                  ⏱ 60초 챌린지
                </button>
              )}
            </nav>
          </>
        )
      }

      /* ---------- 앱 ---------- */

      const LEVELS = {
        보슬보슬: { spawnMs: 1100, maxPoops: 18, speed: 0.8 },
        적당히: { spawnMs: 450, maxPoops: 40, speed: 1 },
        '똥폭우 🌧️': { spawnMs: 140, maxPoops: 90, speed: 1.5, burstOnEnter: 10 },
      }

      const POINTS = { normal: 1, gold: 5, king: 3, fart: -3 }
      const COMBO_WINDOW_MS = 1500
      const CHALLENGE_SECONDS = 60
      const BEST_KEY = 'rps-best-challenge'

      const comboMultiplier = (count) => (count >= 10 ? 3 : count >= 5 ? 2 : 1)

      const readBest = () => {
        try {
          return Number(localStorage.getItem(BEST_KEY)) || 0
        } catch {
          return 0
        }
      }

      function App() {
        const [level, setLevel] = useState('적당히')
        const [score, setScore] = useState(0)
        const [bursts, setBursts] = useState([])
        const [pops, setPops] = useState([])
        const [comboCount, setComboCount] = useState(0)
        const [mode, setMode] = useState('endless')
        const [timeLeft, setTimeLeft] = useState(CHALLENGE_SECONDS)
        const [finished, setFinished] = useState(false)
        const [best, setBest] = useState(readBest)
        const [newBest, setNewBest] = useState(false)
        const [copied, setCopied] = useState(false)
        const [settingsOpen, setSettingsOpen] = useState(false)
        const burstId = useRef(0)
        const combo = useRef({ count: 0, lastAt: 0 })
        const comboTimer = useRef(null)

        const { muted, toggleMute, play } = useSound()
        const { poops, remove, shower } = useFallingPoops(LEVELS[level])

        const challengeRunning = mode === 'challenge' && !finished

        useEffect(() => {
          if (!challengeRunning) return undefined
          const timer = setInterval(() => {
            setTimeLeft((s) => {
              if (s <= 1) {
                setFinished(true)
                return 0
              }
              return s - 1
            })
          }, 1000)
          return () => clearInterval(timer)
        }, [challengeRunning])

        useEffect(() => {
          if (!finished) return
          const isNew = score > best
          setNewBest(isNew)
          if (isNew) {
            setBest(score)
            try {
              localStorage.setItem(BEST_KEY, String(score))
            } catch {}
          }
        }, [finished])

        const resetCombo = useCallback(() => {
          combo.current = { count: 0, lastAt: 0 }
          setComboCount(0)
          clearTimeout(comboTimer.current)
        }, [])

        const startChallenge = useCallback(() => {
          setMode('challenge')
          setScore(0)
          setTimeLeft(CHALLENGE_SECONDS)
          setFinished(false)
          setNewBest(false)
          setCopied(false)
          resetCombo()
        }, [resetCombo])

        const exitChallenge = useCallback(() => {
          setMode('endless')
          setScore(0)
          setFinished(false)
          resetCombo()
        }, [resetCombo])

        const shareScore = useCallback(async () => {
          const url = location.origin + location.pathname
          const text = `무지개똥 말랑이 60초 챌린지 ${score}점! 🌈💩 너도 해볼래?`
          try {
            if (navigator.share) {
              await navigator.share({ text, url })
            } else {
              await navigator.clipboard.writeText(`${text} ${url}`)
              setCopied(true)
              setTimeout(() => setCopied(false), 2000)
            }
          } catch {}
        }, [score])

        const handleHit = useCallback(() => {
          play('bonk')
          navigator.vibrate?.(15)
        }, [play])

        const handlePop = useCallback(
          (spot) => {
            const base = POINTS[spot.type] ?? 1
            let value
            if (spot.type === 'fart') {
              resetCombo()
              value = base
            } else {
              const now = performance.now()
              const c = combo.current
              c.count = now - c.lastAt <= COMBO_WINDOW_MS ? c.count + 1 : 1
              c.lastAt = now
              value = base * comboMultiplier(c.count)
              setComboCount(c.count)
              clearTimeout(comboTimer.current)
              comboTimer.current = setTimeout(resetCombo, COMBO_WINDOW_MS)
            }
            const mult = comboMultiplier(combo.current.count)
            setScore((s) => Math.max(0, s + value))

            const id = burstId.current++
            setBursts((prev) => [...prev, { ...spot, id }])
            setPops((prev) => [...prev, { x: spot.x, y: spot.y, value, mult, type: spot.type, id }])

            play(spot.type === 'gold' ? 'gold' : spot.type === 'fart' ? 'fart' : 'pop')
            navigator.vibrate?.(spot.type === 'king' ? [20, 30, 40] : 30)
          },
          [play, resetCombo],
        )

        const removeBurst = useCallback((id) => {
          setBursts((prev) => prev.filter((b) => b.id !== id))
        }, [])

        const removePop = useCallback((id) => {
          setPops((prev) => prev.filter((p) => p.id !== id))
        }, [])

        return (
          <main className="app">
            <Sky />

            <div className="poop-layer">
              {poops.map((poop) => (
                <PoopSquishy key={poop.id} poop={poop} onPop={handlePop} onHit={handleHit} onDone={remove} />
              ))}
            </div>

            <div className="sparkle-layer">
              {bursts.map((burst) => (
                <Sparkles key={burst.id} burst={burst} onDone={removeBurst} />
              ))}
              {pops.map((pop) => (
                <ScorePop key={pop.id} pop={pop} onDone={removePop} />
              ))}
            </div>

            <Hud
              score={score}
              best={best}
              comboCount={comboCount}
              mult={comboMultiplier(comboCount)}
              level={level}
              levels={LEVELS}
              mode={mode}
              timeLeft={timeLeft}
              onLevelChange={setLevel}
              onShower={() => shower(16)}
              onStartChallenge={startChallenge}
              onOpenSettings={() => setSettingsOpen(true)}
            />

            {settingsOpen && (
              <SettingsSheet muted={muted} onToggleMute={toggleMute} onClose={() => setSettingsOpen(false)} />
            )}

            {finished && (
              <ResultCard
                score={score}
                best={best}
                newBest={newBest}
                copied={copied}
                onRetry={startChallenge}
                onExit={exitChallenge}
                onShare={shareScore}
              />
            )}
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
